name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Install · Typecheck · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # CI build uses placeholder values so Vite doesn't throw on missing env vars
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
          VITE_STRIPE_PUBLIC_KEY: pk_test_placeholder
          VITE_GEMINI_API_KEY: placeholder
          VITE_GROQ_API_KEY: placeholder
          VITE_OLLAMA_API_KEY: placeholder
          VITE_EMAILJS_SERVICE_ID: placeholder
          VITE_EMAILJS_TEMPLATE_ID: placeholder
          VITE_EMAILJS_PUBLIC_KEY: placeholder
